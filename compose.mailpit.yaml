services:
  auth:
    environment:
      AUTH_SMTP_URL: smtp://mailpit:1025
      AUTH_SMTP_FROM: auth@example.test
      AUTH_SMTP_USERNAME: ""
      AUTH_SMTP_PASSWORD: ""
      AUTH_SMTP_SECURITY: none
    depends_on:
      mailpit:
        condition: service_started

  mailpit:
    image: axllent/mailpit:v1.33.1
    ports:
      - "127.0.0.1:8025:8025"
