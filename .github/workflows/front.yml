name: front

on:
  push:
    branches:
      - FRONT-*

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  publish:
    name: publish
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/FRONT-develop' || github.ref == 'refs/heads/FRONT-master'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image tag
        run: |
          if [ "$GITHUB_REF" = "refs/heads/FRONT-master" ]; then
            echo "IMAGE_TAG=stable" >> "$GITHUB_ENV"
          else
            echo "IMAGE_TAG=test" >> "$GITHUB_ENV"
          fi

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: false
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/smp-front:${{ env.IMAGE_TAG }}
