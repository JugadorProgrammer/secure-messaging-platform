name: COORD CI

on:
  push:
    branches: [COORD-develop, COORD-master, 'COORD-*']
  pull_request:
    branches: [COORD-develop, COORD-master]

concurrency:
  group: coord-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: coord
          POSTGRES_PASSWORD: coord_local
          POSTGRES_DB: coord_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U coord -d coord_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DSN: postgres://coord:coord_local@localhost:5432/coord_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - name: go test
        shell: bash  # -eo pipefail: падение тестов не теряется в tee
        run: make cover | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            coverage.out
            coverage.html
          if-no-files-found: error

  docs:
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Generate OpenAPI
        run: make swagger
      - uses: actions/upload-artifact@v4
        with:
          name: swagger
          path: api
          if-no-files-found: error
      - name: Generate docs from code
        run: make docs
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./site
          destination: ./_site
      - uses: actions/upload-artifact@v4
        with:
          name: docs
          path: _site
          if-no-files-found: error

  build:
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make build

  docker:
    needs: [lint, test]
    runs-on: ubuntu-latest
    env:
      DOCKER_BUILD_SUMMARY: false
      DOCKER_BUILD_RECORD_UPLOAD: false
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: smp-coord:ci
